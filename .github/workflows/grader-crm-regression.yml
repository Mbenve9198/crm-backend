name: Grader CRM regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- tests/unit/graderCrmFlow.test.js tests/unit/inboundLeadSecretMiddleware.test.js tests/unit/dialerQueueCallback.test.js tests/unit/dialerWrapUpCall.test.js tests/integration/inboundLeadController.test.js tests/integration/graderCrmMessages.test.js
